<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KATHERYNE // TACTICAL CONSOLE</title>
<style>
/* ==========================================================================
   KatheryneQQ — Endfield / Rhine Lab Industrial Tactical Terminal
   Default: Industrial White (light) | Toggle: Carbon Night (dark)
   ========================================================================== */
:root {
  --bg: #e9ecf1;
  --bg-grid: rgba(18, 21, 26, 0.055);
  --surface: #f7f8fa;
  --surface-2: #ffffff;
  --surface-3: #dfe4ec;
  --line: #cdd3de;
  --line-soft: #dde2eb;
  --line-strong: #14171d;
  --ink: #12151b;
  --ink-2: #4b5464;
  --ink-3: #838e9f;
  --yellow: #f5c400;
  --yellow-hover: #ffcf14;
  --yellow-soft: rgba(245, 196, 0, 0.18);
  --yellow-ink: #12151b;
  --cyan: #0284c7;
  --cyan-soft: rgba(2, 132, 199, 0.11);
  --green: #059669;
  --green-soft: rgba(5, 150, 105, 0.12);
  --red: #dc2626;
  --red-soft: rgba(220, 38, 38, 0.11);
  --amber: #d97706;
  --amber-soft: rgba(217, 119, 6, 0.13);
  --code-bg: #12151c;
  --code-line: #232936;
  --code-ink: #e4e9f2;
  --code-muted: #768196;
  --shadow: 0 2px 10px rgba(18, 21, 27, 0.06);
  --font-sans: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
  --cut: 12px;
}

html[data-theme="dark"] {
  --bg: #0c0e12;
  --bg-grid: rgba(255, 255, 255, 0.038);
  --surface: #13161d;
  --surface-2: #191d26;
  --surface-3: #222834;
  --line: #2a3140;
  --line-soft: #1f2430;
  --line-strong: #f5c400;
  --ink: #eef2f8;
  --ink-2: #9ba5b8;
  --ink-3: #636e82;
  --yellow: #f5c400;
  --yellow-hover: #ffd11a;
  --yellow-soft: rgba(245, 196, 0, 0.14);
  --yellow-ink: #0c0e12;
  --cyan: #38bdf8;
  --cyan-soft: rgba(56, 189, 248, 0.13);
  --green: #34d399;
  --green-soft: rgba(52, 211, 153, 0.13);
  --red: #f87171;
  --red-soft: rgba(248, 113, 113, 0.13);
  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.13);
  --code-bg: #090b0f;
  --code-line: #1f2532;
  --code-ink: #e2e8f2;
  --code-muted: #687388;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font: 13.5px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

/* ---------- global ambient mascot backdrop (optional mode) ---------- */
#mascot-backdrop {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  display: none;
}
#mascot-backdrop.active { display: block; }
#mascot-backdrop img {
  position: absolute; right: 0; bottom: 0; max-height: 92vh; max-width: 55vw;
  object-fit: contain; transform-origin: bottom right;
  mask-image: linear-gradient(to left, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 100%);
  -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 62%, rgba(0,0,0,0) 100%);
  transition: opacity .25s ease;
}

/* ---------- hazard stripe ---------- */
.hazard-bar {
  height: 4px; width: 100%;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 7px, #12151b 7px 14px);
}
.hazard-bar.thin { height: 3px; }

/* ---------- chamfered tactical primitives ---------- */
.panel {
  position: relative;
  background: var(--surface-2);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.panel.cut {
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
}
.panel.cut::after {
  content: ""; position: absolute; top: 0; right: 0; width: var(--cut); height: var(--cut);
  background: linear-gradient(45deg, transparent 47%, var(--line) 48%, var(--line) 54%, transparent 55%);
  pointer-events: none;
}
.panel-head {
  display: flex; align-items: center; gap: 10px; padding: 11px 16px;
  border-bottom: 1px solid var(--line-soft); background: var(--surface);
}
.panel-code {
  font: 700 10px/1 var(--font-mono); letter-spacing: 0.1em; padding: 3px 6px;
  background: var(--ink); color: var(--surface-2); text-transform: uppercase;
}
html[data-theme="dark"] .panel-code { background: var(--yellow); color: var(--yellow-ink); }
.panel-title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
.panel-sub { font: 11px/1 var(--font-mono); color: var(--ink-3); margin-left: auto; text-transform: uppercase; letter-spacing: 0.06em; }
.panel-body { padding: 16px; }

/* ---------- shell ---------- */
#app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.sidebar {
  width: 236px; flex: 0 0 236px; background: var(--surface);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 40;
}
.brand-box { padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 36px; height: 36px; flex: 0 0 36px; background: var(--yellow); color: var(--yellow-ink);
  display: flex; align-items: center; justify-content: center; font: 900 17px/1 var(--font-mono);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.brand-title { font: 800 15px/1.1 var(--font-mono); letter-spacing: 0.06em; }
.brand-sub { font: 10px/1.3 var(--font-mono); color: var(--ink-3); letter-spacing: 0.08em; margin-top: 2px; }

.nav { padding: 10px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.nav-sec {
  font: 700 10px/1 var(--font-mono); color: var(--ink-3); letter-spacing: 0.12em;
  padding: 10px 10px 6px; text-transform: uppercase;
}
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 11px; border: 1px solid transparent; background: transparent;
  color: var(--ink-2); cursor: pointer; text-align: left;
  transition: background .12s, color .12s, border-color .12s;
}
.nav-item .idx { font: 700 10px/1 var(--font-mono); color: var(--ink-3); width: 20px; }
.nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: .82; }
.nav-item .lbl { font-weight: 600; font-size: 13px; flex: 1; }
.nav-item .badge {
  font: 700 10px/1 var(--font-mono); padding: 2px 5px; background: var(--surface-3); color: var(--ink-2);
}
.nav-item:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.nav-item.active {
  background: var(--surface-2); border-color: var(--line); color: var(--ink);
  box-shadow: inset 3px 0 0 var(--yellow);
}
.nav-item.active .idx { color: var(--ink); background: var(--yellow); padding: 2px 3px; text-align: center; }
html[data-theme="dark"] .nav-item.active .idx { color: var(--yellow-ink); }

.sidebar-acct {
  padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-acct .mini-av {
  width: 34px; height: 34px; flex: 0 0 34px; background: var(--surface-3);
  border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center;
  font: 700 13px/1 var(--font-mono);
}
.sidebar-acct .mini-av img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-acct .mini-info { flex: 1; min-width: 0; }
.sidebar-acct .mini-nick { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-acct .mini-uin { font: 11px/1.2 var(--font-mono); color: var(--ink-3); }

.sidebar-foot {
  padding: 9px 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px;
  font: 11px/1 var(--font-mono); color: var(--ink-3);
}
.ver-btn {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  padding: 4px 8px; cursor: pointer; font: 700 11px/1 var(--font-mono);
}
.ver-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ---------- main / topbar ---------- */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 54px; padding: 0 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface-2) 86%, transparent);
  backdrop-filter: blur(8px); display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 30;
}
.menu-btn { display: none; }
.top-route-code {
  font: 700 11px/1 var(--font-mono); padding: 4px 7px; background: var(--yellow); color: var(--yellow-ink);
  letter-spacing: 0.08em;
}
.topbar h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
.top-spacer { flex: 1; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border: 1px solid var(--line); background: var(--surface);
  font: 600 11.5px/1 var(--font-mono); color: var(--ink-2); white-space: nowrap;
}
.pill.green { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); background: var(--green-soft); color: var(--green); }
.pill.amber { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: var(--amber-soft); color: var(--amber); }
.pill.red { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); background: var(--red-soft); color: var(--red); }
.pill.cyan { border-color: color-mix(in srgb, var(--cyan) 45%, var(--line)); background: var(--cyan-soft); color: var(--cyan); }
.pulse-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.green .pulse-dot::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid currentColor;
  animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
}
@keyframes pulseRing { 0% { opacity: .85; transform: scale(.8); } 100% { opacity: 0; transform: scale(2.1); } }

.content {
  padding: 20px 22px 36px; width: 100%; max-width: 1420px;
  animation: pageIn .16s ease-out;
}
@keyframes pageIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 13px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  cursor: pointer; font-weight: 600; font-size: 12.5px; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .08s;
}
.btn svg { width: 14px; height: 14px; }
.btn:hover:not([disabled]) { border-color: var(--ink); background: var(--surface); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn.primary {
  background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); font-weight: 800;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
}
.btn.primary:hover:not([disabled]) { background: var(--yellow-hover); border-color: var(--yellow-hover); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface-2); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn.danger:hover:not([disabled]) { background: var(--red-soft); border-color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover:not([disabled]) { background: var(--surface-3); color: var(--ink); border-color: transparent; }
.btn.sm { padding: 4px 9px; font-size: 11.5px; }
.btn.icon { width: 32px; height: 32px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

input[type="text"], input[type="number"], input[type="password"], input[type="url"], select, textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  padding: 7px 10px; outline: none; color: var(--ink); font-size: 13px;
  transition: border-color .12s;
}
input:focus, select:focus, textarea:focus { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--yellow); }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font: 700 11px/1.2 var(--font-mono); color: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* switch */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; }
.switch input { appearance: none; width: 34px; height: 18px; background: var(--surface-3); border: 1px solid var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--ink-2); transition: transform .15s, background .15s; }
.switch input:checked { background: var(--yellow); border-color: var(--ink); }
.switch input:checked::after { transform: translateX(16px); background: #12151b; }

/* segmented tabs */
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); }
.seg button {
  border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-2);
  padding: 6px 12px; cursor: pointer; font: 700 11.5px/1 var(--font-mono); letter-spacing: 0.04em;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button.active { background: var(--ink); color: var(--surface-2); }
html[data-theme="dark"] .seg button.active { background: var(--yellow); color: var(--yellow-ink); }

/* ---------- overview layout (dual mode: mascot stage vs pure industrial) ---------- */
.ov-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
.ov-layout.with-mascot { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface-2); border: 1px solid var(--line); padding: 13px 15px;
  position: relative;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.kpi.accent::before { background: var(--yellow); }
.kpi.green::before { background: var(--green); }
.kpi.cyan::before { background: var(--cyan); }
.kpi .k-lbl { font: 700 10px/1 var(--font-mono); color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
.kpi .k-val { font: 800 22px/1.2 var(--font-mono); margin-top: 8px; }
.kpi .k-sub { font: 11px/1.3 var(--font-mono); color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ov-mid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.hero-bar {
  display: flex; align-items: center; gap: 16px; padding: 16px 18px;
  background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 14px;
}
.hero-av {
  width: 58px; height: 58px; flex: 0 0 58px; border: 2px solid var(--ink);
  background: var(--yellow); color: var(--yellow-ink); overflow: hidden;
  display: flex; align-items: center; justify-content: center; font: 900 24px/1 var(--font-mono);
}
.hero-av img { width: 100%; height: 100%; object-fit: cover; }
.hero-nick { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero-meta { font: 12px/1.4 var(--font-mono); color: var(--ink-2); margin-top: 3px; }

/* endpoint rows */
.ep-list { display: flex; flex-direction: column; gap: 8px; }
.ep-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--line-soft);
}
.ep-tag { font: 800 10px/1 var(--font-mono); padding: 3px 6px; min-width: 44px; text-align: center; background: var(--ink); color: var(--surface-2); }
.ep-tag.ws { background: var(--cyan); color: #fff; }
.ep-tag.rws { background: var(--amber); color: #12151b; }
.ep-url { font: 12px/1.2 var(--font-mono); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* sparkline telemetry (pure industrial hero card) */
.spark-wrap { display: flex; flex-direction: column; gap: 12px; }
.spark-svg { width: 100%; height: 96px; display: block; background: var(--surface); border: 1px solid var(--line-soft); }
.breakdown-bar { display: flex; height: 8px; width: 100%; background: var(--surface-3); overflow: hidden; gap: 2px; }
.breakdown-bar span { display: block; height: 100%; transition: width .3s; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font: 11px/1.2 var(--font-mono); color: var(--ink-2); }
.legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle; }

/* mascot tactical stage */
.mascot-stage {
  position: sticky; top: 72px; background: var(--surface-2); border: 1px solid var(--line);
  overflow: hidden; display: flex; flex-direction: column;
}
.mascot-canvas {
  position: relative; height: 460px; overflow: hidden;
  background:
    radial-gradient(circle at 50% 80%, var(--yellow-soft), transparent 62%),
    linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px),
    var(--surface);
  background-size: 100% 100%, 20px 20px, 20px 20px, 100% 100%;
  display: flex; align-items: flex-end; justify-content: center;
}
.mascot-canvas img {
  max-height: 100%; max-width: 100%; object-fit: contain; pointer-events: none; user-select: none;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,.18));
  transition: transform .2s ease, opacity .2s ease;
}
.mascot-reticle {
  position: absolute; inset: 10px; pointer-events: none;
  border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
}
.mascot-reticle::before, .mascot-reticle::after {
  content: "+"; position: absolute; font: 700 12px/1 var(--font-mono); color: var(--ink-3);
}
.mascot-reticle::before { top: 4px; left: 6px; }
.mascot-reticle::after { bottom: 4px; right: 6px; }
.mascot-plate {
  padding: 11px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px;
}
.mascot-callsign { font: 800 12px/1.2 var(--font-mono); letter-spacing: 0.06em; }
.mascot-sub { font: 10.5px/1.3 var(--font-mono); color: var(--ink-3); }

/* ---------- events master-detail ---------- */
.ev-split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.95fr); gap: 14px; align-items: start; }
.ev-feed {
  max-height: calc(100vh - 220px); min-height: 460px; overflow-y: auto;
  display: flex; flex-direction: column;
}
.ev-row {
  display: flex; align-items: center; gap: 9px; padding: 9px 13px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer;
  transition: background .1s; border-left: 3px solid transparent;
}
.ev-row:hover { background: var(--surface); }
.ev-row.selected { background: var(--yellow-soft); border-left-color: var(--yellow); }
.ev-row.flash { animation: evFlash .7s ease-out; }
@keyframes evFlash { 0% { background: var(--yellow-soft); } 100% { background: transparent; } }
.ev-type {
  font: 800 10px/1 var(--font-mono); padding: 3px 6px; text-transform: uppercase;
  min-width: 58px; text-align: center; border: 1px solid var(--line); background: var(--surface);
}
.ev-type.message, .ev-type.message_sent { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, var(--line)); background: var(--green-soft); }
.ev-type.notice { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); background: var(--amber-soft); }
.ev-type.request { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 45%, var(--line)); background: var(--cyan-soft); }
.ev-type.meta_event { color: var(--ink-3); }
.ev-sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.ev-time { font: 11px/1 var(--font-mono); color: var(--ink-3); white-space: nowrap; }

.inspector { position: sticky; top: 72px; }
.code-box {
  background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-line);
  padding: 12px 14px; font: 12px/1.55 var(--font-mono); overflow: auto;
  white-space: pre-wrap; word-break: break-word; margin: 0;
}
.j-k { color: #7dd3fc; }
.j-s { color: #86efac; }
.j-n { color: #fde047; }

.act-group-title {

  padding: 10px 12px 5px; background: var(--surface); border-bottom: 1px solid var(--line-soft);
  text-transform: uppercase; position: sticky; top: 0;
}
.act-item {
  display: block; width: 100%; text-align: left; padding: 7px 12px; border: 0;
  border-bottom: 1px solid var(--line-soft); background: transparent; cursor: pointer;
  font: 600 12px/1.3 var(--font-mono); color: var(--ink-2);
}
.act-item:hover { background: var(--surface); color: var(--ink); }
.act-item.active { background: var(--yellow); color: var(--yellow-ink); font-weight: 800; }

/* ---------- logs ---------- */
.log-box {
  height: calc(100vh - 220px); min-height: 460px; overflow-y: auto;
  background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-line);
  padding: 10px 14px; font: 12px/1.6 var(--font-mono); user-select: text;
}
.log-line { white-space: pre-wrap; word-break: break-all; padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.025); }
.log-line.warn { color: #fbbf24; }
.log-line.error { color: #f87171; }
.log-line.dim { color: var(--code-muted); }

/* ---------- login stage (unauthenticated) ---------- */
#login-stage {
  position: relative; z-index: 2; min-height: 100vh; display: none;
  align-items: center; justify-content: center; padding: 24px;
}
#login-stage.active { display: flex; }
.login-shell {
  width: 100%; max-width: 860px; display: grid; grid-template-columns: 320px minmax(0, 1fr);
  background: var(--surface-2); border: 1px solid var(--line); box-shadow: var(--shadow);
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
}
.login-side {
  position: relative; background: #12151b; color: #eef2f8; padding: 26px 22px;
  display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  border-right: 1px solid var(--line);
}
.login-side-bg {
  position: absolute; inset: 0; opacity: .22; pointer-events: none; object-fit: cover; width: 100%; height: 100%;
}
.login-side-inner { position: relative; z-index: 1; }
.login-main { padding: 26px 28px; display: flex; flex-direction: column; }

.qr-frame {
  position: relative; width: 224px; height: 224px; background: #fff; padding: 12px;
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  margin: 8px auto;
}
.qr-frame::before, .qr-frame::after {
  content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid var(--yellow);
}
.qr-frame::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.qr-frame::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.qr-frame img { width: 100%; height: 100%; object-fit: contain; }

.acct-card {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  margin-bottom: 8px; transition: border-color .12s, background .12s;
}
.acct-card:hover { border-color: var(--ink); }
.acct-card.selected { border-color: var(--ink); background: var(--yellow-soft); box-shadow: inset 3px 0 0 var(--yellow); }

/* ---------- config form ---------- */
.cfg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mascot-studio { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.range-row { display: grid; grid-template-columns: 96px 1fr 48px; align-items: center; gap: 10px; margin-bottom: 10px; font: 12px/1 var(--font-mono); }
.range-row input[type="range"] { width: 100%; accent-color: var(--yellow); }

/* ---------- modal & toast ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(10, 12, 16, 0.55); backdrop-filter: blur(4px);
  z-index: 90; display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal-mask.open { display: flex; }
.modal-box { width: 100%; max-width: 500px; background: var(--surface-2); border: 1px solid var(--line); box-shadow: var(--shadow); }

#toasts { position: fixed; top: 16px; right: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 9px 14px; background: var(--ink); color: var(--surface-2);
  border-left: 4px solid var(--yellow); font: 600 12.5px/1.3 var(--font-sans);
  box-shadow: var(--shadow); animation: toastIn .15s ease-out;
}
.toast.ok { border-left-color: var(--green); }
.toast.err { border-left-color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

.empty { padding: 36px 16px; text-align: center; color: var(--ink-3); font: 12.5px/1.6 var(--font-mono); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
.kv .k { font: 700 11px/1.6 var(--font-mono); color: var(--ink-3); text-transform: uppercase; }

/* ---------- mobile drawer ---------- */
#drawer-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 35; }
#drawer-mask.open { display: block; }

@media (max-width: 1080px) {
  .ov-layout.with-mascot { grid-template-columns: 1fr; }
  .mascot-stage { position: static; }
  .mascot-canvas { height: 320px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ov-mid, .ev-split, .pg-split, .cfg-grid, .mascot-studio { grid-template-columns: 1fr; }

/* ---------------- Helpers ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  try { return JSON.parse(text); } catch { return { raw: text, _status: r.status }; }
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });

function toast(msg, kind) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(String(text));
    toast((label || '内容') + ' 已复制', 'ok');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = String(text);
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast((label || '内容') + ' 已复制', 'ok');
  }
}

function fmtDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm ' + String(sec).padStart(2, '0') + 's';
}
function timeStr(sec) {
  if (!sec) return '--:--:--';
  return new Date(sec * 1000).toLocaleTimeString('zh-CN', { hour12: false });
}
function nowStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}
function highlightJson(obj) {
  const raw = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  return esc(raw).replace(/(&quot;(?:\\.|[^&])*?&quot;)(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (m, str, colon, kw) => {
    if (str) return colon ? '<span class="j-k">' + str + '</span>' + colon : '<span class="j-s">' + str + '</span>';
    if (kw) return kw === 'null' ? '<span class="j-z">' + kw + '</span>' : '<span class="j-b">' + kw + '</span>';
    return '<span class="j-n">' + m + '</span>';
  });
}

function activeMascotUrl() {
  const m = S.mascot;
  if (m.source === 'off' || m.mode === 'off') return '';
  if (m.source === 'url') return (m.url || '').trim();
  if (m.source === 'local') return m.localDataUrl || '';
  if (m.source === 'auto') {
    if (m.localDataUrl) return m.localDataUrl;
    if (m.url) return m.url.trim();
    if (S.state && S.state.hasServerMascot) return '/api/mascot' + (S.serverMascotVer ? '?v=' + S.serverMascotVer : '');
  }
  return '';
}

function applyMascotVisuals() {
  const url = activeMascotUrl();
  const m = S.mascot;
  const bd = $('#mascot-backdrop');
  const bdImg = $('#mascot-backdrop-img');
  const useBackdrop = !!url && (m.mode === 'backdrop' || m.mode === 'both');
  if (useBackdrop) {
    bd.classList.add('active');
    if (bdImg.getAttribute('src') !== url) bdImg.src = url;
    bdImg.style.opacity = String(m.bgOpacity);
    bdImg.style.transform = `translate(${m.offsetX}px, ${m.offsetY}px) scale(${m.scale})`;
  } else {
    bd.classList.remove('active');
  }
  // Login side background
  const lbg = $('#login-mascot-bg');
  if (lbg) {
    if (url) { lbg.src = url; lbg.style.display = ''; }
    else { lbg.style.display = 'none'; }
  }
}

function accountOf(uin) {
  return (S.logins || []).find((it) => it.uin === uin) || null;
}

function eventSummary(e) {
  if (!e) return '';
  if (e.post_type === 'message' || e.post_type === 'message_sent') {
    const scope = e.message_type === 'group' ? `[群 ${e.group_id}] ` : '[私聊] ';
    const nick = (e.sender && (e.sender.card || e.sender.nickname)) || e.user_id || '';
    return scope + (nick ? nick + ': ' : '') + (e.raw_message || '[富媒体消息]');
  }
  if (e.post_type === 'notice') {
    if (e.notice_type === 'group_msg_emoji_like') {
      const like = (e.likes && e.likes[0]) || {};
      return `表情回应 [群 ${e.group_id}] ${e.user_id} ${e.is_add ? '+' : '-'}#${like.emoji_id || '?'} (cnt=${like.count ?? 0})`;
    }
    if (e.notice_type === 'group_recall' || e.notice_type === 'friend_recall') {
      return `撤回 ${e.group_id ? '[群 ' + e.group_id + '] ' : ''}user=${e.user_id} msg=${e.message_id || ''}`;
    }
    if (e.notice_type === 'notify' && e.sub_type === 'poke') {
      return `戳一戳 ${e.group_id ? '[群 ' + e.group_id + '] ' : ''}${e.user_id} → ${e.target_id}`;
    }
    return `${e.notice_type}${e.sub_type ? '/' + e.sub_type : ''}${e.group_id ? ' [群 ' + e.group_id + ']' : ''}${e.user_id ? ' user=' + e.user_id : ''}`;
  }
  if (e.post_type === 'request') {
    return `${e.request_type}/${e.sub_type || ''} user=${e.user_id || ''} ${e.comment || ''}`;
  }
  if (e.post_type === 'meta_event') {
    return `${e.meta_event_type}${e.sub_type ? '/' + e.sub_type : ''}`;
  }
  return JSON.stringify(e).slice(0, 120);
}

/* ---------------- Theme ---------------- */
function setTheme(t) {
  S.theme = t;
  document.documentElement.dataset.theme = t;
  localStorage.setItem('kq-theme', t);
  const icon = t === 'dark' ? ICONS.sun : ICONS.moon;
  if ($('#theme-btn')) $('#theme-btn').innerHTML = icon;
  if ($('#ls-theme-btn')) $('#ls-theme-btn').innerHTML = icon;
}

/* ---------------- Router & Shell Switching ---------------- */
function currentRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  return ROUTES[h] ? h : 'overview';
}
function navigate(r) {
  if (!ROUTES[r]) r = 'overview';
  S.route = r;
  if (location.hash !== '#/' + r) location.hash = '#/' + r;
  render();
}

function updateShellVisibility() {
  const st = S.state;
  const online = st && st.phase === 'online';
  const stage = $('#login-stage');
  const app = $('#app');
  if (!online && st) {
    stage.classList.add('active');
    app.style.display = 'none';
    renderLoginStage();
  } else {
    stage.classList.remove('active');
    app.style.display = 'flex';
  }
}

function renderChrome() {
  const st = S.state || {};
  const phaseMap = { loading: ['LOADING', ''], awaiting_login: ['AWAITING_AUTH', 'amber'], logging_in: ['AUTH_BUSY', 'amber'], online: ['ONLINE', 'green'], error: ['FAULT', 'red'] };
  const [label, cls] = phaseMap[st.phase] || ['INIT', ''];
  $('#phase-pill').className = 'pill ' + cls;
  $('#phase-label').textContent = label;

  const ssePill = $('#sse-pill');
  ssePill.className = 'pill ' + (S.sseConnected ? 'cyan' : '');
  ssePill.textContent = S.sseConnected ? 'LINK: SSE' : 'LINK: POLL';

  const acct = accountOf(st.selfUin) || {};
  const nick = acct.nick || st.selfNick || '未登录';
  $('#sb-nick').textContent = nick;
  $('#sb-uin').textContent = st.selfUin ? 'QQ ' + st.selfUin : 'OFFLINE';
  const av = $('#sb-av');
  av.innerHTML = acct.faceUrl ? '<img src="' + esc(acct.faceUrl) + '" alt="">' : esc(String(nick).slice(0, 1).toUpperCase());

  $('#btn-about').textContent = 'v' + (st.appVersion || '-');
  $('#sb-qqver').textContent = 'QQ ' + (st.version || '-');

  // Update overview live counters without full re-render
  const up = $('#kpi-uptime');
  if (up && st.startedAt) up.textContent = fmtDuration(Date.now() - st.startedAt);
  const wsEl = $('#kpi-ws');
  if (wsEl) wsEl.textContent = String(st.wsClients ?? 0);
  const rwsEl = $('#kpi-rws');
  if (rwsEl) rwsEl.textContent = '反向 WS: ' + (st.reverseWsClients ?? 0) + ' 连接';
  const gfEl = $('#kpi-gf');
  if (gfEl) gfEl.textContent = `${st.groupCount ?? 0} / ${st.friendCount ?? 0}`;
  const evCnt = $('#kpi-evcnt');
  if (evCnt && st.eventStats) evCnt.textContent = String(st.eventStats.total ?? 0);

  // Nav active & badge
  const nonMetaCount = S.events.filter((e) => e.post_type !== 'meta_event').length;
  const nav = $('#nav');
  nav.innerHTML = '<div class="nav-sec">OPERATIONS // 模块</div>' + Object.entries(ROUTES).map(([key, r]) =>
    '<button class="nav-item ' + (S.route === key ? 'active' : '') + '" data-route="' + key + '">' +
      '<span class="idx">' + r.idx + '</span>' +
      ICONS[r.icon] +
      '<span class="lbl">' + esc(r.title) + '</span>' +
      (key === 'events' && nonMetaCount ? '<span class="badge">' + nonMetaCount + '</span>' : '') +
    '</button>'
  ).join('');
  nav.querySelectorAll('[data-route]').forEach((b) => b.onclick = () => {
    closeDrawer();
    navigate(b.dataset.route);
  });
}

function closeDrawer() {
  $('#sidebar').classList.remove('open');
  $('#drawer-mask').classList.remove('open');
}

function render() {
  updateShellVisibility();
  applyMascotVisuals();
  if (!S.state || S.state.phase !== 'online') return;
  S.route = currentRoute();
  const r = ROUTES[S.route];
  $('#top-code').textContent = r.code;
  $('#top-title').textContent = r.title;
  renderChrome();
  const page = $('#page');
  page.innerHTML = '';
  PAGES[S.route](page);
}

/* ---------------- Login Stage ---------------- */
let lastLoginStageKey = '';
function renderLoginStage(force) {
  const st = S.state || {};
  $('#ls-phase').textContent = (st.phase || 'INIT').toUpperCase();
  $('#ls-qqver').textContent = st.version || '-';
  $('#ls-appver').textContent = 'v' + (st.appVersion || '-');

  $('#ls-tab-quick').className = S.loginTab === 'quick' ? 'active' : '';
  $('#ls-tab-qr').className = S.loginTab === 'qr' ? 'active' : '';
  $('#ls-tab-quick').onclick = () => { S.loginTab = 'quick'; lastLoginStageKey = ''; renderLoginStage(true); };
  $('#ls-tab-qr').onclick = () => { S.loginTab = 'qr'; lastLoginStageKey = ''; renderLoginStage(true); };

  const key = [S.loginTab, st.phase, st.qrcodeDataUrl || '', st.loginError || '', S.selectedUin, (S.logins || []).length].join('|');
  if (!force && key === lastLoginStageKey) return;
  lastLoginStageKey = key;

  const box = $('#login-stage-body');
  if (S.loginTab === 'quick') {
    const items = S.logins || [];
    box.innerHTML =
      (items.length
        ? '<div style="max-height:240px;overflow-y:auto">' + items.map((it) =>
            '<div class="acct-card ' + (S.selectedUin === it.uin ? 'selected' : '') + '" data-uin="' + esc(it.uin) + '">' +
              '<div class="hero-av" style="width:40px;height:40px;flex:0 0 40px;font-size:16px">' +
                (it.faceUrl ? '<img src="' + esc(it.faceUrl) + '" alt="">' : esc((it.nick || it.uin).slice(0, 1))) +
              '</div>' +
              '<div class="grow"><div style="font-weight:700">' + esc(it.nick || it.uin) + '</div><div class="mono" style="font-size:11.5px;color:var(--ink-3)">QQ ' + esc(it.uin) + '</div></div>' +
              (S.selectedUin === it.uin ? '<span class="panel-code">SELECTED</span>' : '') +
            '</div>'
          ).join('') + '</div>'
        : '<div class="empty">未检测到本地 QQ 登录记录<br>请切换到「扫码登录」</div>') +
      (st.loginError ? '<div style="color:var(--red);font-size:12px;margin:8px 0">' + esc(st.loginError) + '</div>' : '') +
      '<div class="row" style="margin-top:16px">' +
        '<button class="btn" id="ls-reload">' + ICONS.refresh + ' 刷新列表</button>' +
        '<div class="grow"></div>' +
        '<button class="btn primary" id="ls-do-quick" ' + (S.selectedUin ? '' : 'disabled') + '>启动快速登录</button>' +
      '</div>';
    box.querySelectorAll('[data-uin]').forEach((el) => el.onclick = () => { S.selectedUin = el.dataset.uin; renderLoginStage(true); });
    $('#ls-reload').onclick = async () => { await loadLogins(); renderLoginStage(true); };
    $('#ls-do-quick').onclick = async () => {
      if (!S.selectedUin) return;
      $('#ls-do-quick').disabled = true;
      const r = await post('/api/login/quick', { uin: S.selectedUin });
      if (r && r.error) { toast('快速登录失败: ' + r.error, 'err'); $('#ls-do-quick').disabled = false; }
      else toast('已发起快速登录', 'ok');
    };
  } else {
    const qr = st.qrcodeDataUrl;
    box.innerHTML =
      '<div style="text-align:center">' +
        '<div class="qr-frame">' +
          (qr ? '<img src="' + qr + '" alt="QQ QR">' : '<div class="mono" style="font-size:12px;color:#7a8599">' + (st.phase === 'logging_in' ? 'AUTHENTICATING...' : 'REQUESTING QR...') + '</div>') +
        '</div>' +
        '<div class="mono" style="font-size:12px;color:var(--ink-2);margin:10px 0">' +
          (st.phase === 'logging_in' ? '已扫码 · 请在手机端确认' : '请使用手机 QQ 扫描上方二维码') +
        '</div>' +
        (st.loginError ? '<div style="color:var(--red);font-size:12px;margin-bottom:8px">' + esc(st.loginError) + '</div>' : '') +
        '<div class="row" style="justify-content:center;margin-top:10px">' +
          '<button class="btn" id="ls-qr-refresh">' + ICONS.refresh + ' 刷新二维码</button>' +
          '<button class="btn ghost" id="ls-qr-cancel">取消</button>' +
        '</div>' +
      '</div>';
    $('#ls-qr-refresh').onclick = async () => { await post('/api/login/qr', {}); toast('已请求刷新二维码'); };
    $('#ls-qr-cancel').onclick = async () => { await post('/api/login/cancel', {}); S.qrRequested = false; };
    if (!qr && st.phase === 'awaiting_login' && !S.qrRequested) {
      S.qrRequested = true;
      post('/api/login/qr', {}).catch(() => undefined);
    }
  }
}

/* ---------- 01 // OVERVIEW ---------- */
function buildSparklineSvg() {
  const vals = S.spark;
  const max = Math.max(4, ...vals);
  const w = 480, h = 96, pad = 6, bw = (w - pad * 2) / vals.length;
  let bars = '';
  for (let i = 0; i < vals.length; i++) {
    const bh = Math.max(2, Math.round((vals[i] / max) * (h - 22)));
    const x = pad + i * bw + 2;
    const y = h - 6 - bh;
    const fill = vals[i] > 0 ? 'var(--yellow)' : 'var(--line)';
    bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${bh}" fill="${fill}" opacity="${vals[i] > 0 ? '0.95' : '0.45'}"/>`;
  }
  return `<svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h - 6}" x2="${w}" y2="${h - 6}" stroke="var(--line)" stroke-width="1"/>
    <line x1="0" y1="${Math.round(h / 2)}" x2="${w}" y2="${Math.round(h / 2)}" stroke="var(--line)" stroke-dasharray="3 4" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function renderOverviewRecent() {
  const box = $('#ov-recent');
  if (!box) return;
  const items = S.events.filter((e) => e.post_type !== 'meta_event').slice(-8).reverse();
  if (!items.length) {
    box.innerHTML = '<div class="empty">STANDBY // 暂无非心跳事件，收到消息或通知后将实时推送</div>';
    return;
  }
  box.innerHTML = items.map((e, i) =>
    '<div class="ev-row" data-ov-ev="' + i + '">' +
      '<span class="ev-type ' + esc(e.post_type) + '">' + esc(e.post_type === 'message_sent' ? 'SELF' : e.post_type) + '</span>' +
      '<span class="ev-sum">' + esc(eventSummary(e)) + '</span>' +
      '<span class="ev-time">' + timeStr(e.time) + '</span>' +
    '</div>'
  ).join('');
  box.querySelectorAll('[data-ov-ev]').forEach((el) => el.onclick = () => {
    S.selectedEvent = items[Number(el.dataset.ovEv)];
    navigate('events');

function matchesEventFilter(e) {
  if (S.evHideHeartbeat && e.post_type === 'meta_event' && e.meta_event_type === 'heartbeat') return false;
  if (S.evFilter !== 'all') {
    if (S.evFilter === 'message' && e.post_type !== 'message' && e.post_type !== 'message_sent') return false;
    if (S.evFilter !== 'message' && e.post_type !== S.evFilter) return false;
  }
  if (S.evSearch) {
    if (!JSON.stringify(e).toLowerCase().includes(S.evSearch.toLowerCase())) return false;
  }
  return true;
}

function makeEventRow(e, flash) {
  const row = document.createElement('div');
  row.className = 'ev-row' + (S.selectedEvent === e ? ' selected' : '') + (flash ? ' flash' : '');
  row.innerHTML =
    '<span class="ev-type ' + esc(e.post_type) + '">' + esc(e.post_type === 'message_sent' ? 'SELF' : e.post_type) + '</span>' +
    '<span class="ev-sum">' + esc(eventSummary(e)) + '</span>' +
    '<span class="ev-time">' + timeStr(e.time) + '</span>';
  row.onclick = () => {
    S.selectedEvent = e;
    const feed = $('#ev-feed');
    if (feed) feed.querySelectorAll('.ev-row.selected').forEach((n) => n.classList.remove('selected'));
    row.classList.add('selected');
    renderEventInspector();

  return row;
}

function renderEventFeedFull() {
  const feed = $('#ev-feed');
  if (!feed) return;
  const list = S.events.filter(matchesEventFilter).slice(-300).reverse();

  feed.innerHTML = '';
  if (!list.length) {
    feed.innerHTML = '<div class="empty">NO MATCHING EVENTS // 等待事件流入</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for (const e of list) frag.appendChild(makeEventRow(e, false));

function appendEventToFeed(e) {

function renderActionCatalog() {
  const box = $('#pg-catalog');
  if (!box) return;
  const q = S.actSearch.trim().toLowerCase();
  const known = new Set();
  const sections = [];
  for (const g of ACTION_GROUPS) {
    const list = g.list.filter((a) => S.actions.includes(a) && (!q || a.toLowerCase().includes(q)));
    g.list.forEach((a) => known.add(a));
    if (list.length) sections.push({ name: g.name, list });
  }
  const rest = S.actions.filter((a) => !known.has(a) && (!q || a.toLowerCase().includes(q)));
  if (rest.length) sections.push({ name: '其他动作', list: rest });

  if (!sections.length) { box.innerHTML = '<div class="empty">无匹配动作</div>'; return; }
  box.innerHTML = sections.map((sec) =>
    '<div class="act-group-title">' + esc(sec.name) + '</div>' +

  ).join('');

    b.classList.add('active');
  });
}

async function runPlaygroundAction() {
  const action = S.selectedAction;
  let params = {};
  try { params = $('#pg-params').value.trim() ? JSON.parse($('#pg-params').value) : {}; }
  catch (err) { toast('参数 JSON 语法错误: ' + err.message, 'err'); return; }
  const btn = $('#pg-run');
  btn.disabled = true;
  $('#pg-meta').textContent = 'RUNNING...';
  try {
    const t0 = performance.now();
    const res = await post('/api/action', { action, params });
    const cost = Math.round(performance.now() - t0);
    S.actResult = res;
    S.actMeta = `${(res && res.status) || '?'} · code=${res && res.retcode !== undefined ? res.retcode : '-'} · ${cost}ms`;
    $('#pg-resp').innerHTML = highlightJson(res);
    $('#pg-meta').textContent = S.actMeta;
    S.actHistory.unshift({ time: nowStr(), action, params, result: res, cost });
    S.actHistory = S.actHistory.slice(0, 15);
    try { localStorage.setItem('kq-act-hist', JSON.stringify(S.actHistory)); } catch { /* ignore */ }
    renderPgHistory();
  } finally {
    btn.disabled = false;
  }
}

function renderPgHistory() {
  const box = $('#pg-hist');
  if (!box) return;
  if (!S.actHistory.length) { box.innerHTML = '<div class="empty">暂无执行记录</div>'; return; }

/* ---------- 04 // LOGS (Incremental Append — never breaks selection) ---------- */
function logLevel(line) {
  if (/error|失败|异常|fatal|uncaught/i.test(line)) return 'error';
  if (/warn|警告|timeout|超时/i.test(line)) return 'warn';
  if (/^\[.*\]\s*$/.test(line)) return 'dim';
  return 'info';
}
function matchLog(line) {
  const lv = logLevel(line);
  if (S.logFilter !== 'all' && lv !== S.logFilter) return false;
  if (S.logSearch && !line.toLowerCase().includes(S.logSearch.toLowerCase())) return false;
  return true;
}
function makeLogEl(line) {
  const d = document.createElement('div');
  const lv = logLevel(line);
  d.className = 'log-line' + (lv !== 'info' ? ' ' + lv : '');
  d.textContent = line;
  return d;
}

function randomToken() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  crypto.getRandomValues(arr);
  return Array.from(arr, (n) => chars[n % chars.length]).join('');
}

/* ---------------- SSE Real-time Stream + Fallback ---------------- */
let sse = null;
let sseRetryTimer = null;

function handleStateUpdate(next) {
  const prevPhase = S.state && S.state.phase;
  const prevHasMascot = S.state && S.state.hasServerMascot;
  S.state = next;
  if (prevPhase !== 'online' && next.phase === 'online') {
    if (prevPhase) toast('QQ 已上线：' + (next.selfNick || next.selfUin), 'ok');
    loadLogins();
    render();
    return;
  }
  if (prevPhase === 'online' && next.phase !== 'online') {
    render();
    return;
  }
  if (next.phase !== 'online') {
    updateShellVisibility();
    renderLoginStage(false);
    return;
  }
  if (prevHasMascot !== next.hasServerMascot) {
    applyMascotVisuals();
    if (S.route === 'overview') render();
  }
  renderChrome();
}

function connectSSE() {
  if (sse) { try { sse.close(); } catch {} sse = null; }
  if (typeof EventSource === 'undefined') return;
  const es = new EventSource('/api/stream');
  sse = es;
  es.onopen = () => {
    S.sseConnected = true;
    renderChrome();
  };
  es.addEventListener('state', (ev) => {
    try { handleStateUpdate(JSON.parse(ev.data)); } catch {}
  });
  es.addEventListener('ob11', (ev) => {
    try {
      const obj = JSON.parse(ev.data);
      S.events.push(obj);
      if (S.events.length > 500) S.events.shift();
      if (obj.post_type !== 'meta_event') {
        S.spark[S.spark.length - 1]++;
        if (S.route === 'overview') {
          renderOverviewRecent();
          const sb = $('#spark-box');
          if (sb) sb.innerHTML = buildSparklineSvg();
        }
      }
      appendEventToFeed(obj);
      renderChrome();
    } catch {}
  });
  es.addEventListener('log', (ev) => {
    try {
      const line = JSON.parse(ev.data);
      S.logs.push(line);
      if (S.logs.length > 400) S.logs.shift();
      appendLogLine(line);
    } catch {}
  });
  es.onerror = () => {
    S.sseConnected = false;
    renderChrome();
    try { es.close(); } catch {}
    sse = null;
    clearTimeout(sseRetryTimer);
    sseRetryTimer = setTimeout(connectSSE, 3000);
  };
}

async function loadLogins() {
  try {
    S.logins = await api('/api/logins');
    if (!S.selectedUin && S.logins.length) S.selectedUin = S.logins[0].uin;
  } catch { S.logins = []; }
}

/* ---------------- Boot ---------------- */
async function boot() {
  setTheme(S.theme);
  const toggleTheme = () => setTheme(S.theme === 'dark' ? 'light' : 'dark');
  $('#theme-btn').onclick = toggleTheme;
  $('#ls-theme-btn').onclick = toggleTheme;

  $('#menu-btn').onclick = () => { $('#sidebar').classList.toggle('open'); $('#drawer-mask').classList.toggle('open'); };
  $('#drawer-mask').onclick = closeDrawer;
  $('#btn-about').onclick = openAbout;
  $('#about-close').onclick = () => $('#about-modal').classList.remove('open');
  $('#about-modal').onclick = (e) => { if (e.target === $('#about-modal')) $('#about-modal').classList.remove('open'); };
  window.addEventListener('hashchange', () => { S.route = currentRoute(); render(); });

  const [actions, st, evs, logs, cfg] = await Promise.all([
    api('/api/actions').catch(() => []),
    api('/api/state').catch(() => null),
    api('/api/events').catch(() => []),
    api('/api/logs').catch(() => []),
    api('/api/config').catch(() => null),
    loadLogins(),
  ]);
  S.actions = Array.isArray(actions) ? actions : [];
  S.events = Array.isArray(evs) ? evs : [];
  S.logs = Array.isArray(logs) ? logs : [];
  if (cfg && cfg.content !== undefined) S.config = { path: cfg.path, raw: cfg.content, parsed: safeParse(cfg.content) || {} };
  S.state = st;

  // Seed sparkline from recent 60s events
  const nowSec = Math.floor(Date.now() / 1000);
  for (const e of S.events) {
    if (e.post_type === 'meta_event' || !e.time) continue;
    const age = nowSec - e.time;
    if (age >= 0 && age < 60) {
      const idx = Math.min(29, Math.max(0, 29 - Math.floor(age / 2)));
      S.spark[idx]++;
    }
  }

  render();
  connectSSE();

  // 1s local uptime ticker + 2s sparkline roll
  let tick = 0;
  setInterval(() => {
    tick++;
    if (S.state && S.state.startedAt && S.route === 'overview') {
      const up = $('#kpi-uptime');
      if (up) up.textContent = fmtDuration(Date.now() - S.state.startedAt);
    }
    if (tick % 2 === 0) {
      S.spark.shift();
      S.spark.push(0);
      if (S.route === 'overview') {
        const sb = $('#spark-box');
        if (sb) sb.innerHTML = buildSparklineSvg();
      }
    }
  }, 1000);
}
