<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KatheryneQQ 控制台</title>
<style>
:root {
  --bg: #0f1117; --bg-elev: #161a23; --bg-soft: #1c2230; --border: #262d3d;
  --text: #e6ebf5; --muted: #8b97ad; --accent: #5b8cff; --accent-soft: #24304d;
  --green: #38d39f; --yellow: #e8b34b; --red: #f26d7d; --violet: #a07bff;
  --radius: 12px; --shadow: 0 8px 30px rgba(0,0,0,.25);
}
html[data-theme="light"] {
  --bg: #f4f6fb; --bg-elev: #ffffff; --bg-soft: #eef2f9; --border: #dfe5f0;
  --text: #1d2433; --muted: #66738a; --accent: #2f6fed; --accent-soft: #e3ecff;
  --green: #0fa36b; --yellow: #b7791f; --red: #d9485a; --violet: #7c5cd6;
  --shadow: 0 6px 24px rgba(30,50,90,.10);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

#app { display: flex; min-height: 100vh; }

/* ---------- sidebar ---------- */
.sidebar {
  width: 220px; flex: 0 0 220px; background: var(--bg-elev);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px;
  background: linear-gradient(135deg, var(--accent), var(--violet));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700;
}
.brand .name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
.brand .sub { font-size: 11px; color: var(--muted); }
.nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
.nav-label { font-size: 11px; color: var(--muted); padding: 12px 10px 4px; letter-spacing: .5px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px;
  color: var(--muted); cursor: pointer; user-select: none; border: 0; background: none; width: 100%;
  text-align: left; transition: background .15s, color .15s;
}
.nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; }
.nav-item:hover { background: var(--bg-soft); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
}
.icon-btn {
  border: 0; background: var(--bg-soft); color: var(--muted); width: 30px; height: 30px;
  border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--text); }

/* ---------- main ---------- */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 14px 26px;
  border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg-elev) 80%, transparent);
  position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px);
}
.topbar h1 { font-size: 17px; margin: 0; flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; background: var(--bg-soft); color: var(--muted); border: 1px solid transparent;
  white-space: nowrap;
}
.chip.green { color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
.chip.yellow { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.chip.red { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.chip.accent { color: var(--accent); background: var(--accent-soft); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.content { padding: 22px 26px 40px; max-width: 1180px; width: 100%; }

/* ---------- cards ---------- */
.card {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.card + .card { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

.hero { display: flex; align-items: center; gap: 18px; }
.avatar {
  width: 64px; height: 64px; border-radius: 18px; flex: 0 0 64px;
  background: linear-gradient(135deg, var(--accent), var(--violet));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700;
}
.hero .meta { flex: 1; min-width: 0; }
.hero .meta .nick { font-size: 20px; font-weight: 700; }
.hero .meta .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.stat { padding: 14px 16px; }
.stat .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.stat .value { font-size: 18px; font-weight: 650; word-break: break-all; }
.stat .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }

/* ---------- buttons / inputs ---------- */
.btn {
  border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
  padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: filter .15s, opacity .15s;
}
.btn:hover { filter: brightness(1.12); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
input[type="text"], input[type="password"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 11px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 120px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 160px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > label { font-size: 12px; color: var(--muted); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 4px; border-radius: 10px; }
.tab {
  flex: 1; text-align: center; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  color: var(--muted); border: 0; background: transparent; font-size: 13px;
}
.tab.active { background: var(--bg-elev); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); font-weight: 600; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow: auto; }
.list-item {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 9px;
  background: var(--bg-soft); border: 1px solid transparent; cursor: pointer; font-size: 13px;
}
.list-item:hover { border-color: var(--border); }
.list-item.selected { border-color: var(--accent); background: var(--accent-soft); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
.tag.message { color: var(--green); }
.tag.notice { color: var(--yellow); }
.tag.request { color: var(--accent); }
.tag.meta_event { color: var(--violet); }
.json { white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

/* ---------- qr ---------- */
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 4px; }
.qr-box {
  width: 240px; height: 240px; border-radius: 14px; background: #fff;
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.qr-box img { width: 100%; height: 100%; object-fit: contain; }
.qr-box .placeholder { color: #9aa6bd; font-size: 13px; text-align: center; padding: 20px; }
.qr-phase { color: var(--muted); font-size: 13px; }

/* ---------- logs ---------- */
.log-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.log-list {
  height: 560px; overflow: auto; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; font: 12px/1.55 ui-monospace, Consolas, monospace;
}
.log-line { white-space: pre-wrap; word-break: break-all; padding: 1px 0; }
.log-line.warn { color: var(--yellow); }
.log-line.error { color: var(--red); }
.log-line.dim { color: var(--muted); }

.empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 13px; }

/* ---------- toasts ---------- */
#toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  padding: 10px 14px; border-radius: 9px; background: var(--bg-elev); border: 1px solid var(--border);
  box-shadow: var(--shadow); font-size: 13px; animation: slideIn .18s ease-out;
}
.toast.success { border-color: color-mix(in srgb, var(--green) 50%, var(--border)); }
.toast.error { border-color: color-mix(in srgb, var(--red) 50%, var(--border)); }
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .sidebar { position: fixed; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <div class="name">KatheryneQQ</div>
        <div class="sub">OneBot v11 Console</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <span id="foot-version">v-</span>
      <button class="icon-btn" id="theme-btn" title="切换主题"></button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="page-title">基础信息</h1>
      <span class="chip" id="phase-chip"><span class="dot"></span><span id="phase-text">loading</span></span>
      <span class="chip accent" id="self-chip" style="display:none"></span>
    </header>
    <section class="content" id="page"></section>
  </main>
</div>
<div id="toasts"></div>

<script>
'use strict';

/* ---------------- icons ---------------- */
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  login: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>',
  network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 8.5a15 15 0 0 1 19 0"/><path d="M5.5 12a10.5 10.5 0 0 1 13 0"/><path d="M8.8 15.4a6 6 0 0 1 6.4 0"/><circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none"/></svg>',
  logs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h9l4 4v13h-13z"/><path d="M9 10h6M9 13.5h6M9 17h4"/></svg>',
  debug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4"/></svg>',
  events: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/></svg>',
  about: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>',
};

/* ---------------- state ---------------- */
const ROUTES = {
  dashboard: { title: '基础信息', icon: 'dashboard' },
  login:     { title: 'QQ 登录', icon: 'login' },
  network:   { title: '网络配置', icon: 'network' },
  logs:      { title: '运行日志', icon: 'logs' },
  debug:     { title: '接口调试', icon: 'debug' },
  events:    { title: '事件流', icon: 'events' },
  about:     { title: '关于', icon: 'about' },
};

const S = {
  state: null, events: [], logs: [], logins: [], config: null,
  route: 'dashboard',
  theme: localStorage.getItem('kq-theme') || 'dark',
  loginTab: 'quick', selectedUin: '',
  qrRequested: false, lastPhase: '',
  logFilter: 'all', logPause: false, logAutoScroll: true,
  eventFilter: 'all', eventSearch: '', eventPause: false,
  actionHistory: [],
  pendingAction: 'send_group_msg',
};

/* ---------------- helpers ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function api(path, opts) {
  return fetch(path, opts).then(async (r) => {
    const text = await r.text();
    try { return JSON.parse(text); } catch (e) { return { raw: text }; }
  });
}
function post(path, body) {
  return api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
}

function toast(msg, kind) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

const PHASE_TEXT = {
  loading: '加载中', awaiting_login: '等待登录', logging_in: '登录中', online: '在线', error: '异常',
};
function phaseChipClass(phase) {
  if (phase === 'online') return 'chip green';
  if (phase === 'error') return 'chip red';
  if (phase === 'loading') return 'chip';
  return 'chip yellow';
}
function fmtDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + 'h ' : '') + m + 'm ' + sec + 's';
}
function timeStr(sec) {
  const d = new Date((sec || 0) * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function nowStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

/* ---------------- router ---------------- */
function currentRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  return ROUTES[h] ? h : 'dashboard';
}
function navigate(r) {
  if (!ROUTES[r]) r = 'dashboard';
  location.hash = '#/' + r;
  S.route = r;
  render();
}
function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = '<div class="nav-label">控制台</div>' + Object.entries(ROUTES).map(([key, r]) =>
    '<button class="nav-item ' + (S.route === key ? 'active' : '') + '" data-route="' + key + '">' +
      ICONS[r.icon] + '<span>' + esc(r.title) + '</span></button>'
  ).join('');
  nav.querySelectorAll('[data-route]').forEach((b) => b.onclick = () => { navigate(b.dataset.route); $('#sidebar').classList.remove('open'); });
}
function render() {
  S.route = currentRoute();
  renderNav();
  $('#page-title').textContent = ROUTES[S.route].title;
  const page = $('#page');
  page.innerHTML = '';
  PAGES[S.route](page);
  renderTop();
}

/* ---------------- topbar ---------------- */
function renderTop() {
  const st = S.state;
  if (!st) return;
  const chip = $('#phase-chip');
  chip.className = phaseChipClass(st.phase);
  $('#phase-text').textContent = PHASE_TEXT[st.phase] || st.phase;
  const self = $('#self-chip');
  if (st.selfUin) {
    self.style.display = '';
    const acct = accountOf(st.selfUin) || {};
    self.textContent = (acct.nick || st.selfNick || st.selfUin) + ' (' + st.selfUin + ')';
  } else {
    self.style.display = 'none';
  }
  const fv = $('#foot-version');
  if (fv) fv.textContent = 'QQ ' + (st.version || '-');
}

/* ---------------- pages ---------------- */
const PAGES = {};

/** Prefer the local login record's nickname/avatar over the kernel's raw values. */
function accountOf(uin) {
  return (S.logins || []).find((it) => it.uin === uin) || null;
}
function avatarHtml(name, faceUrl, size) {
  const px = size || 64;
  if (faceUrl) {
    return '<img src="' + esc(faceUrl) + '" alt="" style="width:' + px + 'px;height:' + px + 'px;border-radius:' + Math.round(px / 3.6) + 'px;object-fit:cover;flex:0 0 ' + px + 'px">';
  }
  return '<div class="avatar" style="width:' + px + 'px;height:' + px + 'px;flex:0 0 ' + px + 'px;font-size:' + Math.round(px * 0.4) + 'px">' + esc(String(name || 'K').slice(0, 1).toUpperCase()) + '</div>';
}

PAGES.dashboard = (root) => {
  const st = S.state || {};
  const online = st.phase === 'online';
  const acct = accountOf(st.selfUin) || {};
  const displayNick = acct.nick || st.selfNick || '';
  const endpointHost = location.hostname;
  const conf = (S.config && S.config.parsed) || {};
  const http = (conf.http && conf.http.port) || 5700;
  const ws = (conf.ws && conf.ws.port) || 6700;
  const consolePort = (conf.console && conf.console.port) || 6099;

  root.innerHTML =
    '<div class="card">' +
      '<div class="hero">' +
        avatarHtml(displayNick, acct.faceUrl, 64) +
        '<div class="meta">' +
          '<div class="nick">' + esc(displayNick || '未登录') + '</div>' +
          '<div class="sub">' + (st.selfUin ? 'QQ ' + esc(st.selfUin) : '等待扫码或快速登录') + '</div>' +
        '</div>' +
        '<div class="actions">' +
          (online
            ? '<button class="btn" data-go="events">事件流</button><button class="btn" data-go="debug">接口调试</button>'
            : '<button class="btn primary" data-go="login">去登录</button>') +
          '<button class="btn ghost" id="btn-refresh-state">' + ICONS.refresh + '刷新</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="grid cols-3" style="margin-top:16px">' +
      '<div class="card stat"><div class="label">运行状态</div><div class="value">' + esc(PHASE_TEXT[st.phase] || st.phase || '-') + '</div><div class="hint">' + esc(st.loginError || '') + '</div></div>' +
      '<div class="card stat"><div class="label">运行时长</div><div class="value" id="stat-uptime">' + fmtDuration(Date.now() - (st.startedAt || Date.now())) + '</div><div class="hint">进程启动于 ' + new Date(st.startedAt || Date.now()).toLocaleString('zh-CN') + '</div></div>' +
      '<div class="card stat"><div class="label">QQ 版本</div><div class="value">' + esc(st.version || '-') + '</div><div class="hint">AppID ' + esc(st.appid || '-') + '</div></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px"><h2>网络服务</h2>' +
      '<div class="grid cols-3">' +
        '<div class="stat"><div class="label">HTTP</div><div class="value mono">' + esc(endpointHost) + ':' + http + '</div><div class="hint">http://' + esc(endpointHost) + ':' + http + '/get_login_info</div></div>' +
        '<div class="stat"><div class="label">WebSocket</div><div class="value mono">' + esc(endpointHost) + ':' + ws + '</div><div class="hint">ws://' + esc(endpointHost) + ':' + ws + '</div></div>' +
        '<div class="stat"><div class="label">控制台</div><div class="value mono">' + esc(endpointHost) + ':' + consolePort + '</div><div class="hint">当前页面</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px"><h2>最近事件</h2><div class="list" id="recent-events"></div></div>';

function renderRecentEvents() {
  const box = $('#recent-events');

  const items = S.events.slice(-6).reverse();

  box.innerHTML = items.map((e) =>
    '<div class="list-item"><span class="tag ' + esc(e.post_type) + '">' + esc(e.post_type) + '</span>' +
    '<span class="grow mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(summary(e)) + '</span>' +
    '<span class="time">' + timeStr(e.time) + '</span></div>'
  ).join('');
}

function summary(e) {
  if (e.post_type === 'message' || e.post_type === 'message_sent') return (e.message_type === 'group' ? '[' + e.group_id + '] ' : '') + (e.sender && e.sender.nickname ? e.sender.nickname + ': ' : '') + (e.raw_message || '');
  if (e.post_type === 'notice') return e.notice_type + (e.group_id ? ' group=' + e.group_id : '') + (e.user_id ? ' user=' + e.user_id : '');
  if (e.post_type === 'request') return e.request_type + ' user=' + (e.user_id || '');
  if (e.post_type === 'meta_event') return e.meta_event_type + (e.sub_type ? '/' + e.sub_type : '');
  return JSON.stringify(e).slice(0, 120);
}

function logLevel(line) {
  if (/error|失败|异常|fatal|uncaught/i.test(line)) return 'error';
  if (/warn|警告|timeout|超时/i.test(line)) return 'warn';
  if (/^\[.*\]\s*$/.test(line)) return 'dim';
  return '';
}
function renderLogs() {
  const box = $('#log-list');
  if (!box) return;
  const lines = (S.logs || []).filter((l) => S.logFilter === 'all' || logLevel(l) === S.logFilter || (S.logFilter === 'info' && logLevel(l) === ''));
  box.innerHTML = lines.length
    ? lines.map((l) => '<div class="log-line ' + logLevel(l) + '">' + esc(l) + '</div>').join('')
    : '<div class="empty">暂无日志</div>';
  if (S.logAutoScroll) box.scrollTop = box.scrollHeight;
}

  $('#btn-run-action').onclick = async () => {
    const action = sel.value;
    let params = {};
    try { params = $('#action-params').value.trim() ? JSON.parse($('#action-params').value) : {}; }
    catch (e) { $('#action-result').textContent = '参数 JSON 解析失败: ' + e.message; return; }
    $('#btn-run-action').disabled = true;
    $('#action-status').textContent = '执行中…';
    try {
      const t0 = performance.now();
      const r = await post('/api/action', { action, params });
      const cost = Math.round(performance.now() - t0);
      $('#action-result').textContent = JSON.stringify(r, null, 2);
      $('#action-status').textContent = (r.status || '?') + ' · ' + cost + 'ms';
      S.actionHistory.unshift({ time: nowStr(), action, params, result: r, cost });
      S.actionHistory = S.actionHistory.slice(0, 10);
      renderActionHistory();
    } finally {
      $('#btn-run-action').disabled = false;
    }
  };
  renderActionHistory();

  const box = $('#action-history');

  box.innerHTML = S.actionHistory.map((h, i) =>
    '<div class="list-item" data-hist="' + i + '"><span class="tag ' + (h.result && h.result.status === 'ok' ? 'message' : 'notice') + '">' + esc(h.result && h.result.status || '?') + '</span>' +
    '<span class="grow mono">' + esc(h.action) + '</span><span class="time">' + esc(h.time) + ' · ' + h.cost + 'ms</span></div>'
  ).join('');
  box.querySelectorAll('[data-hist]').forEach((el) => el.onclick = () => {
    const h = S.actionHistory[Number(el.dataset.hist)];
    $('#action-select').value = h.action;
    $('#action-params').value = JSON.stringify(h.params, null, 2);
    $('#action-result').textContent = JSON.stringify(h.result, null, 2);
  });
}

/* ---------------- polling ---------------- */
let stateTimer = null;
async function refreshState(force) {
  try {
    const st = await api('/api/state');
    const prevPhase = S.state && S.state.phase;
    S.state = st;
    renderTop();
    if (S.route === 'dashboard' || S.route === 'login') {
      // Update specific fragments without wiping inputs.
      if (S.route === 'dashboard') {
        const up = $('#stat-uptime');
        if (up) up.textContent = fmtDuration(Date.now() - (st.startedAt || Date.now()));
      }
      if (S.route === 'login') {
        if (st.phase === 'online' && prevPhase && prevPhase !== 'online') {
          toast('QQ 登录成功', 'success');
          navigate('dashboard');
          return;
        }
        if (S.loginTab === 'qr') {
          // Re-render QR area only when content changed.
          const box = $('#login-body');
          if (box) {
            const key = (st.qrcodeDataUrl || '') + '|' + st.phase + '|' + (st.loginError || '');
            if (box.dataset.key !== key) { box.dataset.key = key; renderQrLogin(); }
          }
        }
      }
    }
    if (force) toast('状态已刷新', 'success');
  } catch (e) { /* keep polling */ }
}

async function refreshEvents() {
  if (S.eventPause) return;
  try {
    S.events = await api('/api/events');
    if (S.route === 'events') renderEventList();
    if (S.route === 'dashboard') renderRecentEvents();
  } catch (e) { /* ignore */ }
}
async function refreshLogs(force) {
  if (S.logPause && !force) return;
  try {
    S.logs = await api('/api/logs');
    if (S.route === 'logs') renderLogs();
  } catch (e) { /* ignore */ }
}

function startPolling() {
  if (stateTimer) clearInterval(stateTimer);
  stateTimer = setInterval(async () => {
    await refreshState(false);
    if (S.route === 'dashboard' || S.route === 'events') await refreshEvents();
    if (S.route === 'logs') await refreshLogs(false);
  }, 1500);
}

/* ---------------- boot ---------------- */
async function boot() {
  document.documentElement.dataset.theme = S.theme;
  $('#theme-btn').innerHTML = S.theme === 'dark' ? ICONS.sun : ICONS.moon;
  $('#theme-btn').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    localStorage.setItem('kq-theme', S.theme);
    $('#theme-btn').innerHTML = S.theme === 'dark' ? ICONS.sun : ICONS.moon;
  };

  window.addEventListener('hashchange', () => { S.route = currentRoute(); render(); });
  S.route = currentRoute();

  try { window.__actions = await api('/api/actions'); } catch (e) { window.__actions = []; }
  // Load login records first: nickname/avatar shown in the header come from them.
  await loadLogins();
  await refreshState(true);
  // NapCat-style: land on the login page until the account is online.
  if (S.state && S.state.phase !== 'online' && S.route === 'dashboard' && !location.hash) {
    S.route = 'login';
    location.hash = '#/login';
  }
  render();
  await Promise.all([refreshEvents(), refreshLogs(true)]);
  if (S.route === 'login' && S.loginTab === 'quick') renderQuickLogin();
  startPolling();
}

boot();
</script>
